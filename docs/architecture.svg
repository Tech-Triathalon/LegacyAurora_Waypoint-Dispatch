<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND CANVAS -->
  <rect width="1080" height="740" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- HEADER -->
  <text x="540" y="44" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="800" letter-spacing="-0.02em">Waypoint Dispatch — Full System Architecture Map</text>
  <text x="540" y="68" fill="#94a3b8" font-size="12" text-anchor="middle">Dispatcher · Loader · Driver · Store Manager Roles · API Mesh · PostgreSQL 16</text>

  <!-- TIER 1: THE 4 USER ROLES (CLIENT FRONTENDS) -->
  <text x="40" y="105" fill="#f59e0b" font-size="12" font-weight="700" letter-spacing="0.05em">TIER 1: THE FOUR USER ROLES (RESPONSIVE PWA FRONTENDS)</text>

  <!-- Role 1: Dispatcher -->
  <rect x="40" y="120" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="52" y="132" width="100" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="58" y="146" fill="#f59e0b" font-size="10" font-weight="800">1. DISPATCHER</text>
  <text x="52" y="172" fill="#f8fafc" font-size="14" font-weight="700">Planning Console</text>
  <text x="52" y="192" fill="#cbd5e1" font-size="11">• WDI Order Queue (Scarcity)</text>
  <text x="52" y="208" fill="#cbd5e1" font-size="11">• Engine Allocation &amp; Commit</text>
  <text x="52" y="224" fill="#cbd5e1" font-size="11">• Deferral Ledger (CAP/REF/INV)</text>
  <text x="52" y="240" fill="#cbd5e1" font-size="11">• Live Runs &amp; Telemetry Radar</text>
  <text x="52" y="258" fill="#f59e0b" font-size="10" font-family="monospace">client/dispatcher.html</text>

  <!-- Role 2: Loader -->
  <rect x="295" y="120" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="307" y="132" width="100" height="20" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="313" y="146" fill="#38bdf8" font-size="10" font-weight="800">2. DOCK LOADER</text>
  <text x="307" y="172" fill="#f8fafc" font-size="14" font-weight="700">Warehouse Tablet</text>
  <text x="307" y="192" fill="#cbd5e1" font-size="11">• Reverse-Drop Manifest</text>
  <text x="307" y="208" fill="#cbd5e1" font-size="11">• Staging Checklists &amp; Notes</text>
  <text x="307" y="224" fill="#cbd5e1" font-size="11">• Shortage Flagging + Photos</text>
  <text x="307" y="240" fill="#cbd5e1" font-size="11">• Glove Mode UI (@768px)</text>
  <text x="307" y="258" fill="#38bdf8" font-size="10" font-family="monospace">client/loader.html</text>

  <!-- Role 3: Driver -->
  <rect x="550" y="120" width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8"/>
  <rect x="562" y="132" width="100" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="568" y="146" fill="#10b981" font-size="10" font-weight="800">3. FLEET DRIVER</text>
  <text x="562" y="172" fill="#f8fafc" font-size="14" font-weight="700">Mobile PWA (@390px)</text>
  <text x="562" y="192" fill="#cbd5e1" font-size="11">• Leaflet Route Navigation</text>
  <text x="562" y="208" fill="#cbd5e1" font-size="11">• POD Signature &amp; Camera</text>
  <text x="562" y="224" fill="#cbd5e1" font-size="11">• Offline Outbox (outbox.js)</text>
  <text x="562" y="240" fill="#cbd5e1" font-size="11">• Idempotent Sync by eventId</text>
  <text x="562" y="258" fill="#10b981" font-size="10" font-family="monospace">client/driver.html</text>

  <!-- Role 4: Store Manager -->
  <rect x="805" y="120" width="235" height="150" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.8"/>
  <rect x="817" y="132" width="115" height="20" rx="4" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="823" y="146" fill="#a855f7" font-size="10" font-weight="800">4. STORE MANAGER</text>
  <text x="817" y="172" fill="#f8fafc" font-size="14" font-weight="700">Outlet Counter (120)</text>
  <text x="817" y="192" fill="#cbd5e1" font-size="11">• Real-Time Order Placement</text>
  <text x="817" y="208" fill="#cbd5e1" font-size="11">• Delivery Timeline &amp; ETA</text>
  <text x="817" y="224" fill="#cbd5e1" font-size="11">• Pinned Deferral Notices</text>
  <text x="817" y="240" fill="#cbd5e1" font-size="11">• Shortage Flag Auto-Match</text>
  <text x="817" y="258" fill="#a855f7" font-size="10" font-family="monospace">client/store.html</text>

  <!-- PROTOCOL BUS: HTTP & SSE -->
  <line x1="155" y1="270" x2="155" y2="330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
  <line x1="410" y1="270" x2="410" y2="330" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <line x1="665" y1="270" x2="665" y2="330" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <line x1="920" y1="270" x2="920" y2="330" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>

  <text x="540" y="305" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="700">HTTPS REST API (JWT httpOnly Cookie) + Server-Sent Events (SSE Realtime Stream)</text>

  <!-- TIER 2: NODE.JS EXPRESS BACKEND SERVICE -->
  <text x="40" y="345" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.05em">TIER 2: EXPRESS BACKEND SERVICE &amp; LOGISTICS ENGINE</text>
  <rect x="40" y="360" width="1000" height="190" rx="12" fill="url(#serverGrad)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Module 1: Routing & Engine -->
  <rect x="65" y="380" width="215" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="80" y="405" fill="#f59e0b" font-size="13" font-weight="800">Allocation Engine</text>
  <text x="80" y="426" fill="#cbd5e1" font-size="11">• engine.js (Greedy Best-Fit)</text>
  <text x="80" y="444" fill="#cbd5e1" font-size="11">• Priority: Chilled &gt; Defer &gt; Win</text>
  <text x="80" y="462" fill="#cbd5e1" font-size="11">• validate.js (Hard Feasibility)</text>
  <text x="80" y="480" fill="#cbd5e1" font-size="11">• Temp, Van-only, Caps &amp; Fuel</text>
  <text x="80" y="498" fill="#cbd5e1" font-size="11">• travel.js (Congestion/Disruption)</text>
  <text x="80" y="516" fill="#94a3b8" font-size="10">/api/plan/allocate · /commit</text>

  <!-- Module 2: Security & RBAC -->
  <rect x="305" y="380" width="220" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="320" y="405" fill="#38bdf8" font-size="13" font-weight="800">Auth &amp; Security Shield</text>
  <text x="320" y="426" fill="#cbd5e1" font-size="11">• bcrypt Password Hashing</text>
  <text x="320" y="444" fill="#cbd5e1" font-size="11">• JWT 12h in httpOnly Cookie</text>
  <text x="320" y="462" fill="#cbd5e1" font-size="11">• requireRole Middleware Gates</text>
  <text x="320" y="480" fill="#cbd5e1" font-size="11">• Sliding-Window Rate Limiters</text>
  <text x="320" y="498" fill="#cbd5e1" font-size="11">• Zod-Style Input Validation</text>
  <text x="320" y="516" fill="#94a3b8" font-size="10">/api/auth/login · security.js</text>

  <!-- Module 3: Realtime & Sync -->
  <rect x="550" y="380" width="225" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="565" y="405" fill="#10b981" font-size="13" font-weight="800">SSE Stream &amp; Sync Bus</text>
  <text x="565" y="426" fill="#cbd5e1" font-size="11">• realtime.js (Targeted Channels)</text>
  <text x="565" y="444" fill="#cbd5e1" font-size="11">• driver:{vId} · loader:{vId}</text>
  <text x="565" y="462" fill="#cbd5e1" font-size="11">• store:{outletId} · dispatcher</text>
  <text x="565" y="480" fill="#cbd5e1" font-size="11">• /events/batch (Idempotent Sync)</text>
  <text x="565" y="498" fill="#cbd5e1" font-size="11">• Dedupe by client UUID eventId</text>
  <text x="565" y="516" fill="#94a3b8" font-size="10">idempotency.js (24h replay safety)</text>

  <!-- Module 4: Operations & Matching -->
  <rect x="800" y="380" width="215" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="815" y="405" fill="#a855f7" font-size="13" font-weight="800">Ops &amp; Discrepancies</text>
  <text x="815" y="426" fill="#cbd5e1" font-size="11">• /api/flags (Dock Shortages)</text>
  <text x="815" y="444" fill="#cbd5e1" font-size="11">• /api/receipt (Store Claims)</text>
  <text x="815" y="462" fill="#cbd5e1" font-size="11">• Auto-match flag to receipt</text>
  <text x="815" y="480" fill="#cbd5e1" font-size="11">• /api/telemetry (Outage Sim)</text>
  <text x="815" y="498" fill="#cbd5e1" font-size="11">• /api/analytics/summary (KPIs)</text>
  <text x="815" y="516" fill="#94a3b8" font-size="10">Singleton Prisma Client Pool</text>

  <!-- DB CONNECTOR -->
  <line x1="540" y1="550" x2="540" y2="590" stroke="#10b981" stroke-width="3"/>
  <text x="555" y="575" fill="#10b981" font-size="11" font-weight="700">Prisma ORM Client</text>

  <!-- TIER 3: DATABASE (POSTGRESQL 16) -->
  <text x="40" y="605" fill="#10b981" font-size="12" font-weight="700" letter-spacing="0.05em">TIER 3: PERSISTENCE LAYER (POSTGRESQL 16 RELATIONAL STORE)</text>
  <rect x="40" y="620" width="1000" height="95" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="65" y="648" fill="#f8fafc" font-size="15" font-weight="800">🗄️ PostgreSQL 16 Schema Models:</text>
  <text x="65" y="672" fill="#cbd5e1" font-size="12">
    User · Outlet (120) · Vehicle (60) · Order (58 Seeded) · Trip · TripStop · DeliveryEvent · ShortageFlag · DeferralLedger
  </text>
  <text x="65" y="696" fill="#94a3b8" font-size="11">
    Dual Connection: Direct Port 5432 (Local Compose) · PgBouncer Transaction Pooler Port 6543 (Production Supabase &amp; Vercel)
  </text>
</svg>
