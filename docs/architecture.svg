<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="880" height="560" fill="#0f172a"/>
  <text x="440" y="36" fill="#f5f5f5" font-size="20" text-anchor="middle" font-weight="700">Waypoint Dispatch — Architecture</text>

  <rect x="90" y="70" width="700" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="96" fill="#f5f5f5" font-size="15" text-anchor="middle" font-weight="700">Browser — 5 vanilla pages (Day-5 design, untouched)</text>
  <text x="440" y="118" fill="#cbd5e1" font-size="12" text-anchor="middle">index · dispatcher · driver · loader · store</text>
  <text x="440" y="138" fill="#cbd5e1" font-size="12" text-anchor="middle">sw.js app-shell cache · outbox.js offline queue (localStorage-first)</text>
  <text x="440" y="158" fill="#94a3b8" font-size="11" text-anchor="middle">driver/store @390px · loader @768px · glove-mode</text>

  <line x1="440" y1="170" x2="440" y2="210" stroke="#f59e0b" stroke-width="2"/>
  <text x="455" y="195" fill="#f59e0b" font-size="12">/api/*  · JWT httpOnly cookie</text>

  <rect x="90" y="210" width="700" height="180" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="440" y="236" fill="#f5f5f5" font-size="15" text-anchor="middle" font-weight="700">Express API (Node 20)</text>
  <text x="120" y="262" fill="#cbd5e1" font-size="12">/api/auth — bcrypt + JWT + role middleware</text>
  <text x="120" y="282" fill="#cbd5e1" font-size="12">/api/orders — queue + capacity verdict banner</text>
  <text x="120" y="302" fill="#cbd5e1" font-size="12">/api/plan — allocate (dry-run) / commit (hard validation)</text>
  <text x="120" y="322" fill="#cbd5e1" font-size="12">/api/trips — driver + loader manifests</text>
  <text x="120" y="342" fill="#cbd5e1" font-size="12">/api/events/batch — offline sync, idempotent by eventId</text>
  <text x="120" y="362" fill="#cbd5e1" font-size="12">/api/flags · /api/receipt · /api/outlet/:id/timeline</text>
  <text x="120" y="382" fill="#cbd5e1" font-size="12">/api/telemetry — outage simulation + fleet board</text>
  <text x="660" y="262" fill="#94a3b8" font-size="11" text-anchor="end">allocation/engine.js — greedy, deterministic</text>
  <text x="660" y="280" fill="#94a3b8" font-size="11" text-anchor="end">allocation/validate.js — pure hard-feasibility rules</text>
  <text x="660" y="298" fill="#94a3b8" font-size="11" text-anchor="end">travel.js — freeflow × speed × disruption</text>

  <line x1="440" y1="390" x2="440" y2="430" stroke="#38bdf8" stroke-width="2"/>
  <text x="455" y="415" fill="#38bdf8" font-size="12">Prisma</text>

  <rect x="90" y="430" width="700" height="96" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="456" fill="#f5f5f5" font-size="15" text-anchor="middle" font-weight="700">PostgreSQL 16</text>
  <text x="440" y="480" fill="#cbd5e1" font-size="12" text-anchor="middle">User · Outlet · Vehicle · Order · Trip · TripStop</text>
  <text x="440" y="500" fill="#cbd5e1" font-size="12" text-anchor="middle">DeliveryEvent (unique eventId) · ShortageFlag · DeferralLedger</text>

  <text x="440" y="548" fill="#64748b" font-size="11" text-anchor="middle">Judges: docker compose up (app :8080 + db) · Production: Vercel + Supabase · CI: compose boot + smoke</text>
</svg>
