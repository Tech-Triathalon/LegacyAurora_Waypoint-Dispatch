<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="660" fill="#0f172a"/>
  <text x="470" y="34" fill="#f5f5f5" font-size="20" text-anchor="middle" font-weight="700">Waypoint Dispatch — Data Model</text>

  <g font-size="12" fill="#f5f5f5">
    <!-- User -->
    <rect x="40" y="70" width="210" height="128" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="52" y="92" font-weight="700" fill="#f59e0b">User</text>
    <text x="52" y="112">id · username · passwordHash</text>
    <text x="52" y="130">role (dispatcher|driver|loader|manager)</text>
    <text x="52" y="148">name</text>
    <text x="52" y="166">vehicleId? —→ Vehicle (1:1)</text>
    <text x="52" y="184">outletId? —→ Outlet (1:1)</text>

    <!-- Outlet -->
    <rect x="40" y="240" width="210" height="166" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="52" y="262" font-weight="700" fill="#10b981">Outlet</text>
    <text x="52" y="282">outletId (OUT001…) PK</text>
    <text x="52" y="300">brand · district · depot</text>
    <text x="52" y="318">dockType · parkingConstraint</text>
    <text x="52" y="336">mallWindow</text>
    <text x="52" y="354">windowOpen · windowClose</text>
    <text x="52" y="372" fill="#94a3b8">← from outlets.csv (120)</text>
    <text x="52" y="392" fill="#94a3b8">orders · users</text>

    <!-- Vehicle -->
    <rect x="40" y="450" width="210" height="166" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="52" y="472" font-weight="700" fill="#38bdf8">Vehicle</text>
    <text x="52" y="492">vehicleId (VEH001…) unique</text>
    <text x="52" y="510">type (truck|van) · temp (reefer|ambient)</text>
    <text x="52" y="528">weightCapKg · volumeCapM3</text>
    <text x="52" y="546">fuelType · kmPerL · weeklyFuelQuotaL</text>
    <text x="52" y="564">depot · status</text>
    <text x="52" y="582">telemetryStale (outage sim)</text>
    <text x="52" y="602" fill="#94a3b8">← from vehicles.csv (60)</text>

    <!-- Order -->
    <rect x="320" y="70" width="230" height="222" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="332" y="92" font-weight="700" fill="#f59e0b">Order</text>
    <text x="332" y="112">id PK · outletId FK</text>
    <text x="332" y="130">brand · district · depot</text>
    <text x="332" y="148">tempRequirement (chilled|ambient)</text>
    <text x="332" y="166">units · weightKg · volumeM3</text>
    <text x="332" y="184">orderDate · windowOpen/Close</text>
    <text x="332" y="202">deferredYesterday</text>
    <text x="332" y="220">status (queued|allocated|</text>
    <text x="344" y="236">deferred|delivered)</text>
    <text x="332" y="254">deferralReason (CAP|REF|INV)</text>
    <text x="332" y="272">promiseDate</text>

    <!-- Trip -->
    <rect x="320" y="330" width="230" height="170" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="332" y="352" font-weight="700" fill="#38bdf8">Trip</text>
    <text x="332" y="372">id PK · vehicleId FK · tripNo (1|2)</text>
    <text x="332" y="390">brand · district · depot</text>
    <text x="332" y="408">totalWeight · totalVolume</text>
    <text x="332" y="426">estMinutes · distanceKm · fuelLiters</text>
    <text x="332" y="444">status (planned|loading|departed|completed)</text>
    <text x="332" y="462">committedAt</text>
    <text x="332" y="482" fill="#94a3b8">unique(vehicleId, tripNo)</text>

    <!-- TripStop -->
    <rect x="320" y="530" width="230" height="110" rx="8" fill="#1e293b" stroke="#a78bfa"/>
    <text x="332" y="552" font-weight="700" fill="#a78bfa">TripStop</text>
    <text x="332" y="572">id PK · tripId FK · seq · orderId FK</text>
    <text x="332" y="590">plannedArrival</text>
    <text x="332" y="610" fill="#94a3b8">unique(tripId, seq) · unique(orderId)</text>

    <!-- DeliveryEvent -->
    <rect x="620" y="70" width="280" height="180" rx="8" fill="#1e293b" stroke="#ef4444"/>
    <text x="632" y="92" font-weight="700" fill="#ef4444">DeliveryEvent</text>
    <text x="632" y="112">id PK · eventId unique ← idempotency</text>
    <text x="632" y="130">orderId? FK · vehicleId? FK</text>
    <text x="632" y="148">type (loaded|departed|arrived|pod|issue|receipt)</text>
    <text x="632" y="166">payload JSON · clientTimestamp</text>
    <text x="632" y="184">serverTimestamp · syncedFlag</text>
    <text x="632" y="204" fill="#94a3b8">replayed sync → duplicate, never double-record</text>
    <text x="632" y="224" fill="#94a3b8">POD binds to outlets, not sequence</text>

    <!-- ShortageFlag -->
    <rect x="620" y="290" width="280" height="140" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="632" y="312" font-weight="700" fill="#f59e0b">ShortageFlag</text>
    <text x="632" y="332">id PK · orderId FK</text>
    <text x="632" y="350">itemDesc · qty · reason · photoPath?</text>
    <text x="632" y="368">status (open|acknowledged|resolved)</text>
    <text x="632" y="386">createdBy · createdAt</text>
    <text x="632" y="406" fill="#94a3b8">receipt auto-matches open flags</text>

    <!-- DeferralLedger -->
    <rect x="620" y="470" width="280" height="150" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="632" y="492" font-weight="700" fill="#10b981">DeferralLedger</text>
    <text x="632" y="512">id PK · orderId FK</text>
    <text x="632" y="530">reason (CAP|REF|INV) · detail</text>
    <text x="632" y="548">promiseDate · promisedAt</text>
    <text x="632" y="566">kept (bool?) · resolvedAt</text>
    <text x="632" y="586" fill="#94a3b8">kept/broken promise tracking</text>
  </g>

  <!-- Relations -->
  <g stroke="#64748b" fill="none" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="250" y1="150" x2="320" y2="150"/>
    <line x1="250" y1="320" x2="320" y2="240"/>
    <line x1="250" y1="520" x2="320" y2="420"/>
    <line x1="550" y1="180" x2="620" y2="160"/>
    <line x1="550" y1="400" x2="620" y2="350"/>
    <line x1="550" y1="600" x2="620" y2="540"/>
    <line x1="435" y1="292" x2="435" y2="330"/>
    <line x1="435" y1="500" x2="435" y2="530"/>
  </g>
</svg>
